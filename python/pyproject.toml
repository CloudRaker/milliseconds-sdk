[project]
name = "cloudraker-milliseconds"
version = "0.2.2"
description = "Typed decisions over text. The SDK for decision-machine-1 at milliseconds.ai."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CloudRaker" }]
keywords = ["milliseconds", "decision-machine-1", "classification", "extraction", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "typing-extensions>=4.12; python_version < '3.11'",
]

[project.urls]
Homepage = "https://milliseconds.ai"
Documentation = "https://docs.milliseconds.ai"
Source = "https://github.com/CloudRaker/milliseconds-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milliseconds"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "pyright>=1.1.414",
  "ruff>=0.16",
  "pydantic>=2.13",
  "typing-extensions>=4.12",
]

[tool.pyright]
typeCheckingMode = "strict"
# `str` is a `Sequence[str]`, so the str overload must come first and therefore
# overlaps the Sequence one. tests/test_types.py pins the resulting shapes.
reportOverlappingOverload = "none"
# Every module here is private to the package. `__init__` is the public surface.
reportPrivateUsage = "none"
pythonVersion = "3.10"
include = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
